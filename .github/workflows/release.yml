name: Release

# Baut Installer fuer macOS (universal), Windows und Linux und legt sie als
# Entwurf-Release an. Ausgeloest durch einen Versions-Tag ("v0.1.0" o. ae.)
# oder manuell ueber "Run workflow". Der Entwurf muss danach von Hand
# veroeffentlicht werden -- so gibt es vor der Veroeffentlichung noch eine
# Gelegenheit zur Kontrolle.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust-Targets fuer macOS (universal) installieren
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Rust-Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust-Build-Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Linux-Systemabhaengigkeiten (Tauri v2 + WebKitGTK)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Frontend-Abhaengigkeiten
        working-directory: app
        run: npm ci

      - name: Sidecar-Abhaengigkeiten
        working-directory: app/sidecar
        run: npm ci

      - name: Portable Node.js-Laufzeit fuer macOS (beide Architekturen) bundeln
        if: matrix.platform == 'macos-latest'
        run: |
          scripts/fetch-node-runtime.sh darwin-arm64 macos-arm64
          scripts/fetch-node-runtime.sh darwin-x64 macos-x64

      - name: Portable Node.js-Laufzeit fuer Linux bundeln
        if: matrix.platform == 'ubuntu-22.04'
        run: scripts/fetch-node-runtime.sh linux-x64 linux-x64

      - name: Portable Node.js-Laufzeit fuer Windows bundeln
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "20.18.1"
          $dest = "app/sidecar/node-runtime/windows-x64"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $zip = "$env:RUNNER_TEMP/node.zip"
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v$version/node-v$version-win-x64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          Copy-Item "$env:RUNNER_TEMP/node-v$version-win-x64/node.exe" "$dest/node.exe"

      - name: Rust-Tests
        working-directory: app/src-tauri
        run: cargo test --locked

      - name: Tauri-Build + Entwurf-Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "DKB-PDF-Tool ${{ github.ref_name }}"
          releaseBody: |
            ## Welche Datei fuer welches Betriebssystem?

            ### 🍎 macOS (Apple Silicon + Intel, eine Datei fuer beide)
            - **`DKB-PDF-Tool_*_universal.dmg`** -- herunterladen, oeffnen,
              App in den Programme-Ordner ziehen.

            ### 🪟 Windows
            - **`DKB-PDF-Tool_*_x64-setup.exe`** -- Installer, fuer die
              meisten die richtige Wahl.
            - `DKB-PDF-Tool_*_x64_en-US.msi` -- alternativ, falls MSI-Pakete
              bevorzugt werden (z. B. per Firmenrichtlinie).

            ### 🐧 Linux
            - **`DKB-PDF-Tool_*_amd64.AppImage`** -- ausfuehrbar machen
              (`chmod +x`) und direkt starten, keine Installation noetig.
            - `DKB-PDF-Tool_*_amd64.deb` -- fuer Debian/Ubuntu-basierte
              Systeme.
            - `DKB-PDF-Tool-*-1.x86_64.rpm` -- fuer Fedora/RHEL-basierte
              Systeme.

            Die Datei `DKB-PDF-Tool_universal.app.tar.gz` ist kein
            Installer zum Herunterladen, sondern nur fuer die interne
            Update-Pruefung gedacht.

            ---

            Automatisch gebauter Entwurf-Release. Vor dem Veroeffentlichen
            bitte kurz die Installer pruefen -- siehe README fuer Hinweise
            zu unsignierten Paketen (macOS-Gatekeeper / Windows
            SmartScreen).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
